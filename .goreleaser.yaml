# 【任意・高速化パス】ビルド済みバイナリを配り、タップ formula を自動更新する場合の雛形。
# 独立リポジトリ github.com/jiikko/esa-cli のルートに .goreleaser.yaml として置く。
# 使い方: git tag v0.1.0 && git push --tags → GitHub Actions で goreleaser を実行。
#
# 注意: GoReleaser はメジャーバージョンでスキーマ（特に homebrew 出力のキー名 brews/homebrew_casks）が
#       変わることがある。適用前に `goreleaser check` と公式ドキュメントで最新のキー名を確認すること。
version: 2

builds:
  - id: esa
    main: .
    binary: esa
    env: [CGO_ENABLED=0]      # modernc.org/sqlite は pure Go なので cgo 不要
    goos: [darwin]            # Keychain/Chrome cookie 復号が macOS 前提
    goarch: [arm64, amd64]
    ldflags:
      - -s -w

archives:
  - id: esa
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

# formula をタップへ自動 push（トークン/権限の設定が必要）。
# GoReleaser のバージョンによっては `homebrew_casks` に読み替える。
brews:
  - name: esa
    repository:
      owner: jiikko
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/jiikko/esa-cli"
    description: "社内 esa (esa.io) を Chrome cookie 認証で参照する読み取り専用 CLI"
    license: "MIT"
    test: |
      assert_match "esa - ", shell_output("#{bin}/esa --help")
